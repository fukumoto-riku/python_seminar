[project]
name = "self-code"
version = "0.1.0"
description = "QM9 gap_eV prediction notebook (lesson 9)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "optuna>=4.9.0",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "rdkit>=2026.3.4",
    "scikit-learn>=1.9.0",
    "shap>=0.51.0",
    "tqdm>=4.69.0",
    "xgboost>=3.2.0",
]

# ノートブックのみのプロジェクトなので、ルートをビルド対象にしない（依存だけを venv に入れる）
[tool.uv]
package = false
